# Reusable workflow: build ONE stage of the Dockerfile for each architecture
# on a native runner and push it to the intermediate stages repository
#   ghcr.io/<owner>/xcmsrocker-stages:<target>-<arch>
# The previous stage is taken from the image pushed by the previous job, so
# every job only compiles its own stage and stays under the 6 h job limit.
name: _stage

on:
  workflow_call:
    inputs:
      target:
        description: Dockerfile stage to build
        required: true
        type: string
      prev:
        description: Previous stage name ('' for the first stage)
        required: false
        type: string
        default: ''
      arches:
        description: JSON list of architectures
        required: false
        type: string
        default: '["amd64","arm64"]'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ inputs.target }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      STAGES: ghcr.io/${{ github.repository_owner }}/xcmsrocker-stages
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ inputs.target }}-${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          provenance: false
          tags: ${{ env.STAGES }}:${{ inputs.target }}-${{ matrix.arch }}
          build-contexts: ${{ inputs.prev != '' && format('{0}=docker-image://{1}:{0}-{2}', inputs.prev, env.STAGES, matrix.arch) || '' }}
          secrets: |
            github_pat=${{ secrets.GITHUB_TOKEN }}
